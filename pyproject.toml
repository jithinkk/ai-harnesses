[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harnesses"
version = "0.1.0"
description = "A DIY exploration of AI agent harnesses and trade-off analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.9",
    "langgraph>=1.1.3",
    "langchain-anthropic>=1.1.0",
    "langchain-openai>=1.1.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
agent-framework = [
    "agent-framework>=1.17.0",
]
dapr-agents = [
    "dapr-agents>=1.0.6",
]
dev = [
    "pytest>=8.3.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-include-markdown-plugin>=7.3.0",
]
openai-agents = [
    "openai-agents>=0.22.0",
]
strands = [
    "strands-agents>=1.54.0",
]

[tool.uv]
conflicts = [
    [
        { group = "strands" },
        { group = "agent-framework" },
        { group = "dapr-agents" },
        { group = "openai-agents" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["deepagents_harness", "openai_agents_harness", "agent_framework_harness", "strands_harness", "dapr_agents_harness", "shared"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "deepagents_harness*", "openai_agents_harness*", "agent_framework_harness*", "strands_harness*", "dapr_agents_harness*"]
